<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <meta
      name="description"
      content="AuricUI design system · Interactive React components and theme playground"
    />
    <title>AuricUI · Component documentation</title>
    <script>
      try {
        if (localStorage.getItem('auricui.docs.theme') === 'light') document.documentElement.dataset.theme = 'light';
        if (localStorage.getItem('auricui.docs.locale') === 'zh-CN') document.documentElement.lang = 'zh-CN';
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
